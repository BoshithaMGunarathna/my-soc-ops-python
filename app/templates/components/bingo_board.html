<div class="grid grid-cols-5 gap-2 w-full max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="relative flex items-center justify-center p-3 text-center font-medium transition-all duration-300 select-none min-h-[60px] text-xs leading-tight rounded-organic border-2 m-0 hover:scale-105 focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-neon
        {%- if square.is_free_space %}
            bg-nature-mid text-white font-bold text-sm shadow-md cursor-default
        {%- elif square.is_marked %}
            {%- if is_winning %}
                bg-accent-neon text-white border-accent-neon shadow-neon-heavy
            {%- else %}
                bg-nature-base text-white border-nature-mid shadow-md hover:shadow-lg
            {%- endif %}
        {%- else %}
            bg-nature-pale text-nature-dark border-nature-light hover:border-nature-mid hover:shadow-md hover:bg-nature-light
        {%- endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked %}
        <span class="absolute top-1 right-1 text-lg">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
