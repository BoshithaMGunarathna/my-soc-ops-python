<div id="game-container">
<div class="flex flex-col min-h-full bg-gradient-nature">
    <!-- Header -->
    <header class="bg-gradient-hero text-white shadow-md">
        <div class="flex items-center justify-between p-4 px-6">
            <button
                hx-post="/reset"
                hx-target="#game-container"
                hx-swap="outerHTML"
                class="text-accent-neon-light font-semibold text-sm px-3 py-2 rounded-organic transition-all hover:scale-110 hover:shadow-neon focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
                ← Back
            </button>
            <h1 class="font-bold font-heading text-xl">Soc Ops</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <!-- Instructions Card -->
    <div class="bg-white mx-4 mt-4 mb-4 rounded-organic p-4 shadow-base border-l-4 border-nature-mid">
        <p class="text-center text-nature-mid text-sm font-medium">
            🎯 Tap a square when you find someone who matches it.
        </p>
        {% if session.has_bingo %}
        <p class="text-center text-accent-neon font-bold text-sm mt-2 animate-glow-pulse">
            ✨ BINGO! You got a line!
        </p>
        {% endif %}
    </div>

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
